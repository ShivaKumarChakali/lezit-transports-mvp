# LEZIT Transport MVP — CI / CD
#
# Stages (each is a separate job, so GitHub shows build / test / ui-test /
# deploy green or red individually):
#   1. build   — install, Prisma generate, typecheck + lint + build both apps
#   2. test    — Jest (API) + Vitest (web) unit / smoke tests
#   3. ui-test — Playwright smoke tests against the Next.js app
#   4. deploy  — Railway, ONLY on push to main and ONLY if build + test + ui-test pass
#
# Required secret for deploy (GitHub Settings > Secrets and variables > Actions):
#   RAILWAY_TOKEN — a Railway account token (railway.app dashboard > Tokens).
#   No real token is stored here. Until it is added, the deploy job will fail
#   at the "Deploy to Railway" step — that is expected.
#   The Railway project must already exist and be linked to this repo
#   (run `railway link` once locally, or set the project in the Railway
#   dashboard). For this monorepo, configure two Railway services,
#   one for apps/api and one for apps/web, and adjust the working
#   directory / --service flag in the deploy steps below if needed.

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Typecheck API (NestJS)
        working-directory: apps/api
        run: npm run typecheck

      - name: Typecheck Web (Next.js)
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint API (NestJS)
        working-directory: apps/api
        run: npm run lint

      - name: Lint Web (Next.js)
        working-directory: apps/web
        run: npm run lint

      - name: Build API (NestJS)
        working-directory: apps/api
        run: npm run build

      - name: Build Web (Next.js)
        working-directory: apps/web
        run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run API unit tests (Jest)
        working-directory: apps/api
        run: npm test

      - name: Run Web unit tests (Vitest)
        working-directory: apps/web
        run: npm test

  ui-test:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: apps/web
        run: npm run test:ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [build, test, ui-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Deploys the linked Railway project. For this monorepo, link the
          # project once (railway link) and configure one service per app
          # (apps/api and apps/web) in the Railway dashboard.
          railway up --detach
