# LEZIT Transport MVP — CI / CD
#
# Stages (each is a separate job, so GitHub shows build / test / ui-test /
# deploy green or red individually):
#   1. build   — install, Prisma generate, typecheck + lint + build both apps
#   2. test    — Jest (API) + Vitest (web) unit / smoke tests
#   3. ui-test — Playwright smoke tests against the Next.js app
#   4. deploy  — Railway, ONLY on push to main and ONLY if build + test + ui-test pass
#
# Deployment is handled by Railway itself: the Railway project watches the
# repo's main branch and auto-deploys the api service (apps/api) and the web
# service (apps/web) on every push. No token or CLI step is needed here, so
# this workflow only builds and tests. The RAILWAY_TOKEN secret is no longer
# used; it can be removed from the repo's Actions secrets.

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Typecheck API (NestJS)
        working-directory: apps/api
        run: npm run typecheck

      - name: Typecheck Web (Next.js)
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint API (NestJS)
        working-directory: apps/api
        run: npm run lint

      - name: Lint Web (Next.js)
        working-directory: apps/web
        run: npm run lint

      - name: Build API (NestJS)
        working-directory: apps/api
        run: npm run build

      - name: Build Web (Next.js)
        working-directory: apps/web
        run: npm run build

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run API unit tests (Jest)
        working-directory: apps/api
        run: npm test

      - name: Run Web unit tests (Vitest)
        working-directory: apps/web
        run: npm test

  ui-test:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: apps/web
        run: npm run test:ui

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [build, test, ui-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Note Railway auto-deploy
        run: |
          echo "Railway auto-deploys the api and web services from main on every push."
          echo "See the Railway project dashboard for the live deploy status."
